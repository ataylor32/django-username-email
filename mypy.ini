[mypy]
strict = True
# The Django admin and form classes that cuser extends can't be subscripted at
# runtime, and parameterizing them with CUser would conflict with projects that
# reuse them for their own user model, so they're used without type arguments.
disallow_any_generics = False
plugins = mypy_django_plugin.main
exclude = /migrations/

[mypy.plugins.django-stubs]
django_settings_module = typecheck_settings
